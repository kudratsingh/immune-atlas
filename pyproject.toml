[project]
name = "immune-atlas"
version = "0.1.0"
description = "Immune cell population analysis pipeline and dashboard for a clinical trial dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-jsonschema>=4.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["immune_atlas*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PT", "RUF", "D"]
ignore = ["D203", "D213", "D104"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
exclude = ["dashboard/", "outputs/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=immune_atlas --cov=load_data --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = ["integration: runs real entry points on the real CSV"]

[tool.coverage.run]
branch = true
source = ["immune_atlas", "load_data"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
